name: check
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # weekly: catch drift from the canonical tmTheme scope table
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Scope table matches the canonical tmTheme port
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/living-code-theme/tmtheme/main/src/scopes.mjs -o "$RUNNER_TEMP/scopes.mjs"
          diff -u "$RUNNER_TEMP/scopes.mjs" src/scopes.mjs || { echo "::error file=src/scopes.mjs::Drifted from living-code-theme/tmtheme src/scopes.mjs; copy it unchanged."; exit 1; }
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: living-code-package
          path: dist/*
          if-no-files-found: error
